spring:
  #  main:
  #    web-application-type: reactive
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: simple
          uri: http://authentication:8081
          predicates:
            - Path=/users/**

        - id: company
          uri: http://reservation:8082
          predicates:
            - Path=/companies/**

        - id: reservationAdmin
          uri: http://reservation:8082
          predicates:
            - Path=/reservations/**
          filters:
            UserAuthFilter

        - id: resourcesAdmin
          uri: http://reservation:8082
          predicates:
            - Path=/resources/**
          filters:
            UserAuthFilter

        - id: tagsAdmin
          uri: http://reservation:8082
          predicates:
            - Path=/tags
          filters:
            AdminAuthFilter

        - id: tagsUser
          uri: http://reservation:8082
          predicates:
            - Path=/tags/**
          filters:
            UserAuthFilter

        - id: reportUser
          uri: http://reservation:8082
          predicates:
            - Path=/reports
          filters:
            UserAuthFilter

        - id: reportAdmin
          uri: http://reservation:8082
          predicates:
            - Path=/reports/**
          filters:
            AdminAuthFilter

